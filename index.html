<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyecto Olaf | Predictor Iris</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #111827, #263b65);
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
        }

        .container {
            background: white;
            color: #1f2937;
            width: 100%;
            max-width: 550px;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }

        h1 {
            text-align: center;
            color: #4338ca;
            margin-bottom: 10px;
        }

        .description {
            text-align: center;
            color: #64748b;
            margin-bottom: 30px;
        }

        label {
            display: block;
            font-weight: bold;
            margin: 16px 0 7px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            font-size: 16px;
        }

        input:focus {
            outline: 2px solid #6366f1;
            border-color: #6366f1;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 15px;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #3730a3;
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        #resultado {
            display: none;
            margin-top: 25px;
            padding: 20px;
            background: #eef2ff;
            border-radius: 12px;
            text-align: center;
        }

        #especie {
            color: #4338ca;
            font-size: 25px;
            font-weight: bold;
            text-transform: capitalize;
        }

        #mensaje {
            text-align: center;
            margin-top: 15px;
            color: #dc2626;
        }

        .footer {
            text-align: center;
            color: #94a3b8;
            font-size: 12px;
            margin-top: 25px;
        }
    </style>
</head>

<body>

    <main class="container">

        <h1>🌸 Predictor Iris</h1>

        <p class="description">
            Inteligencia artificial para clasificar flores Iris.
        </p>

        <form id="formulario">

            <label for="sepal_length">
                Longitud del sépalo (cm)
            </label>
            <input type="number" id="sepal_length"
                   value="5.1" min="0" step="any" required>

            <label for="sepal_width">
                Ancho del sépalo (cm)
            </label>
            <input type="number" id="sepal_width"
                   value="3.5" min="0" step="any" required>

            <label for="petal_length">
                Longitud del pétalo (cm)
            </label>
            <input type="number" id="petal_length"
                   value="1.4" min="0" step="any" required>

            <label for="petal_width">
                Ancho del pétalo (cm)
            </label>
            <input type="number" id="petal_width"
                   value="0.2" min="0" step="any" required>

            <button type="submit" id="boton">
                Predecir especie
            </button>

        </form>

        <div id="resultado" aria-live="polite">
            <h3>Resultado de la inteligencia artificial</h3>
            <p>Especie identificada:</p>
            <div id="especie"></div>
        </div>

        <p id="mensaje" role="alert"></p>

        <div class="footer">
            Proyecto Olaf | Machine Learning con Python
        </div>

    </main>

    <script>
        const formulario = document.getElementById("formulario");
        const boton = document.getElementById("boton");
        const resultado = document.getElementById("resultado");
        const especie = document.getElementById("especie");
        const mensaje = document.getElementById("mensaje");

        formulario.addEventListener("submit", async function(event) {
            event.preventDefault();

            mensaje.textContent = "";
            resultado.style.display = "none";
            boton.disabled = true;
            boton.textContent = "Analizando flor...";

            const datos = {
                sepal_length: Number(document.getElementById("sepal_length").value),
                sepal_width: Number(document.getElementById("sepal_width").value),
                petal_length: Number(document.getElementById("petal_length").value),
                petal_width: Number(document.getElementById("petal_width").value)
            };

            try {
                const respuesta = await fetch("/predict", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(datos)
                });

                if (!respuesta.ok) {
                    throw new Error("Error al comunicarse con la API.");
                }

                const data = await respuesta.json();

                especie.textContent = data.prediccion;
                resultado.style.display = "block";

            } catch (error) {
                mensaje.textContent =
                    "No se pudo obtener la predicción. Verifica que la API esté funcionando.";
                console.error(error);

            } finally {
                boton.disabled = false;
                boton.textContent = "Predecir especie";
            }
        });
    </script>

</body>
</html>
